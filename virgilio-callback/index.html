<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Virgílio</title>
<style>
body{font-family:system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;line-height:1.5}
code{word-break:break-all;background:#eee;padding:.2rem .4rem;border-radius:.25rem}
</style>
</head>
<body>
<p id="status">Devolvendo a autorização para o Virgílio no seu computador…</p>
<script>
const params = new URLSearchParams(location.search);
const target = "http://127.0.0.1:54390/callback" + location.search;
const status = document.getElementById("status");
if (!params.get("code") && !params.get("error")) {
  status.textContent = "Nenhuma autorização recebida.";
} else {
  location.replace(target);
  setTimeout(() => {
    status.innerHTML = "Se o Virgílio não abriu, volte ao terminal. Código de autorização: <code></code>";
    status.querySelector("code").textContent = params.get("code") || params.get("error");
  }, 3000);
}
</script>
</body>
</html>
